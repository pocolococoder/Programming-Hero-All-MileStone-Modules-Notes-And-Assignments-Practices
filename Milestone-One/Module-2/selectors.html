<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Selector</title>

    <style>
        p{
            color: red;
        }
        #fifth{
            color: purple;
            font-size: 24px;
            font-weight: bold;
        }
        .yellow{
            color: rgb(25, 0, 255);
        }
        .bold{
            font-weight: bold;
        }
        .blue{
            background-color: blue;
        }
        input[type='password']{
            font-size: 20px;
            color: red;
        }
        .span{
            color: red;
            background-color: rgb(0, 145, 80);
        }
        /* *{
            margin: 20px;
            padding: 20px;
        } */
    </style>
</head>
<body>
    <h2>Explore Mixed Selectors</h2>
    <p>My <span class="span">first line of</span> CSS</p>
    <p>My first line of CSS</p>
    <p class="yellow bold">My first line of CSS</p>
    <p class="bold">My first line of CSS</p>
    <p id="fifth">My first line of CSS</p>
    <p>My first line of CSS</p>
    <p class="yellow bold">My first line of CSS</p>
    <p class="blue">My first line of CSS</p>
    <p class="blue">My first line of CSS</p>


    <form action="
    ">
    <input type="text" name="" id="">
    <input type="password" name="" id="">
</form>
</body>
</html>
