<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Flex</title>
    <style>
        .container{
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items:flex-end;
            height: 600px;
            width: 600px;
        }
        .box{
            background-color: burlywood;
            font-size: 3em;
            height: 300px;
            width: 300px;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="box">
                something
            </div>
    </div>


</body>
</html>
