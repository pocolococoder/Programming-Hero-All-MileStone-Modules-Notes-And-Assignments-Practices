<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: flex;
            gap: 20px;

        }
        .container div{
            border: 2px solid tomato;
            height: 50px;
            font-size: 3em;
            width: 100px;
        }

        .box{
            font-size: 2rem;
            height: 50px;
            width: 100px;
            border: 2px solid slateblue;
        }

        .box-container{
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .user{
            border: 2px solid skyblue;
            height: 70px;
            width: 100px;
            border-color: blue;
            font-size: 2rem;
        }

        .div-card-container{
            display: flex;
            justify-content:space-between;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div>

    <div class="box-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

    <div class="div-card-container">
        <div class="user">user-1</div>
        <div class="user">user-2</div>
        <div class="user">user-3</div>
    </div>
    
</body>
</html>
