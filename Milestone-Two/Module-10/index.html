<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket</title>

    <style>
        .field{
            border: 1px solid steelblue;
        }

        .bat{
            transition: transform 0.5s;
        }
        .field:hover .bat{
            transform: rotate(-55deg);
            transform-origin: top right;
        }
        .ball{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: red;
            position: relative;
            left: 540px;
            bottom: 30px;
            transition:  transform 1s ease-out 0.2s;
        }
        .field:hover .ball{
            transform: translate(800px,-500px);
        }
        
    </style>
</head>
<body>
    <div class="field">
        <img class="bat" src="./bat.jpg" alt="">
        <div class="ball">

        </div>
    </div>
</body>
</html>
