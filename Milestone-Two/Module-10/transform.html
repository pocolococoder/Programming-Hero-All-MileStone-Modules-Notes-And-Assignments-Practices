<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>

    <style>
        .inner{
            width: 200px;
            height: 200px;
        }

        .container{
            border: 2px solid steelblue;
            background: aquamarine;
            width: 200px;
            height: 200px;
        }

        .inner{
            border: 2px solid brown;
            background-color: palegoldenrod;
            /* transform: scale(0.75) ; */
            transform: scale(0.5) translateX(100px) translateY(-100px);
        }
    </style>
</head>
<body>
    <h2>Explore Transform and Translate</h2>
    <div class="container">
        <div class="inner">Inner 1</div>
    </div>
    <div class="container">
        <div class="inner">Inner 2</div>
    </div>
    <div class="container">
        <div class="inner">Inner 3</div>
    </div>
</body>
</html>
