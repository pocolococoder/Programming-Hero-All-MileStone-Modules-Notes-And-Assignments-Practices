<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        .calendar{
             display: grid;
             grid-template-columns: repeat(7,1fr);
             row-gap: 25px;
             place-items: center;
        }

        .date{
            border-radius: 100%;
            padding: 10px;
            width:25px;
            text-align: center;
            font-weight: bold;
            background-color: rgb(162, 0, 255);
            color: white;
            font-size: 1.4rem;

        }

        .day{
            border-radius: 100%;
            padding: 10px;
            width:25px;
            text-align: center;
            font-weight: bold;
            background-color: rgb(2, 150, 166);
            color: white;
            font-size: 1.4rem;
        }
        .cal-sec{
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 60px;
            border: 2px solid black;
            height: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            
        }

        .cal-h1{
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    

    <section class="cal-sec">

<h1 class="cal-h1">My Calendar</h1>

        <div class="calendar">
        <div class="day">S</div>
        <div class="day">M</div>
        <div class="day">T</div>
        <div class="day">W</div>
        <div class="day">T</div>
        <div class="day">F</div>
        <div class="day">S</div>
        <div class="date">29</div>
        <div class="date">30</div>
        <div class="date">31</div>
        <div class="date">1</div>
        <div class="date">2</div>
        <div class="date">3</div>
        <div class="date">4</div>
        <div class="date">5</div>
        <div class="date">6</div>
        <div class="date">7</div>
        <div class="date">8</div>
        <div class="date">9</div>
        <div class="date">10</div>
        <div class="date">11</div>
        <div class="date">12</div>
        <div class="date">13</div>
        <div class="date">14</div>
        <div class="date">15</div>

    </div>
    </section>
    
</body>
</html>
